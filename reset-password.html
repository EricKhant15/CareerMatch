<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choose a new CareerMatch password." />
    <title>Reset Password | CareerMatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="login-page">
    <a class="auth-home-link" href="login.html">← Back to sign in</a>

    <div class="login-box">
      <section class="login-brand">
        <div class="logo">
          <span class="logo-mark">CM</span>
          <span>Career<span class="brand-purple">Match</span></span>
        </div>
        <div class="auth-brand-copy">
          <p class="login-kicker">Secure reset</p>
          <h1>Choose a new password.</h1>
          <p>The reset link proves that you can access the email connected to this account.</p>
        </div>
      </section>

      <section class="login-form">
        <span class="auth-eyebrow">Password Reset</span>
        <h2>Create new password</h2>
        <p id="resetPasswordStatus">Checking your secure reset link...</p>

        <form id="resetPasswordForm" class="auth-form" hidden>
          <label>
            New password
            <input id="newPassword" type="password" name="newPassword" minlength="6" autocomplete="new-password" required />
          </label>

          <label>
            Confirm new password
            <input id="confirmPassword" type="password" name="confirmPassword" minlength="6" autocomplete="new-password" required />
          </label>

          <label class="show-password-control">
            <input id="showResetPasswords" type="checkbox" />
            <span>Show passwords</span>
          </label>

          <p class="password-requirements">Use at least 6 characters and choose a password you do not use elsewhere.</p>
          <button id="resetPasswordButton" class="primary-btn" type="submit">Update password</button>
          <p id="resetPasswordMessage" class="auth-message" aria-live="polite"></p>
        </form>
      </section>
    </div>

    <script>
      // Save the callback before Supabase removes its one-time tokens from the address bar.
      window.careerMatchRecoveryCallback = window.location.href;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="reset-password.js"></script>
  </body>
</html>
