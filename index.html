<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerMatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="login-page">
    <div class="login-box">
      <section class="login-brand">
        <div class="logo">
          <span class="logo-mark">CM</span>
          <span>Career<span class="brand-purple">Match</span></span>
        </div>

        <div class="auth-brand-copy">
            <h1>Match Your Potential</h1>
            <p>Internship matching for students and companies.</p>
          </div>
      </section>

      <section class="login-form">
        <span class="auth-eyebrow">CareerMatch Access</span>
        <h2 id="authTitle">Sign in</h2>
        <p id="authSubtitle">Continue to your CareerMatch account.</p>

        <div class="auth-switch" aria-label="Authentication mode">
          <button
            class="auth-switch-btn active"
            type="button"
            data-auth-mode="login"
          >
            Sign in
          </button>

          <button
            class="auth-switch-btn"
            type="button"
            data-auth-mode="signup"
          >
            Create account
          </button>
        </div>

        <form id="authForm" class="auth-form">
          <input type="hidden" id="authMode" name="mode" value="login" />

          <label>
            Account type
            <select id="accountType" name="role">
              <option value="student">Student</option>
              <option value="company">Company</option>
            </select>
          </label>

          <label id="nameField" class="signup-only is-hidden">
            <span id="nameLabel">Full name</span>
            <input
              id="fullNameInput"
              name="fullName"
              placeholder="Enter your full name"
            />
          </label>

          <div id="companyFields" class="company-signup-fields is-hidden">
            <div class="company-signup-heading">
              <h3>Company verification</h3>
              <p>
                This information will be reviewed by the CareerMatch admin.
              </p>
            </div>

            <div class="auth-field-grid">
              <label>
                Industry
                <select name="industry" data-company-required>
                  <option value="">Select industry</option>
                  <option>Technology</option>
                  <option>Finance</option>
                  <option>Healthcare</option>
                  <option>Education</option>
                  <option>E-commerce</option>
                  <option>Telecommunications</option>
                  <option>Consulting</option>
                  <option>Manufacturing</option>
                  <option>Media</option>
                  <option>Other</option>
                </select>
              </label>

              <label>
                Company size
                <select name="companySize" data-company-required>
                  <option value="">Select company size</option>
                  <option value="1-10">1-10 employees</option>
                  <option value="11-50">11-50 employees</option>
                  <option value="51-200">51-200 employees</option>
                  <option value="201-500">201-500 employees</option>
                  <option value="501-1000">501-1,000 employees</option>
                  <option value="1000+">More than 1,000 employees</option>
                </select>
              </label>

              <label>
                Year established
                <input
                  type="number"
                  name="yearEstablished"
                  min="1800"
                  max="2026"
                  placeholder="Example: 2015"
                  data-company-required
                />
              </label>

              <label>
                Company location
                <input
                  name="companyLocation"
                  placeholder="Example: Bangkok"
                  data-company-required
                />
              </label>

              <label>
                Official website
                <input
                  type="url"
                  name="website"
                  placeholder="https://company.com"
                  data-company-required
                />
              </label>

              <label>
                Phone number
                <input
                  type="tel"
                  name="phoneNumber"
                  placeholder="+66..."
                  data-company-required
                />
              </label>

              <label>
                Contact person
                <input
                  name="contactName"
                  placeholder="Contact person's full name"
                  data-company-required
                />
              </label>

              <label>
                Contact position
                <input
                  name="contactPosition"
                  placeholder="Example: HR Manager"
                  data-company-required
                />
              </label>

              <label>
                Registration number
                <input
                  name="registrationNumber"
                  placeholder="Official registration number"
                  data-company-required
                />
              </label>

              <label>
                LinkedIn or official social page
                <input
                  type="url"
                  name="linkedinUrl"
                  placeholder="https://linkedin.com/company/..."
                />
              </label>
            </div>

            <label>
              Company description
              <textarea
                name="companyDescription"
                rows="4"
                maxlength="1000"
                placeholder="Describe the company, its work, and internship environment."
                data-company-required
              ></textarea>
            </label>

            <label>
              Verification document
              <input
                type="file"
                name="verificationDocument"
                accept=".pdf,.png,.jpg,.jpeg"
                data-company-required
              />
              <small>
                Upload a company registration document in PDF, PNG, or JPG
                format.
              </small>
            </label>

            <label class="auth-checkbox">
              <input
                type="checkbox"
                name="informationConfirmed"
                data-company-required
              />
              <span>
                I confirm that this information is accurate and that I am
                authorized to represent this company.
              </span>
            </label>
          </div>

          <label>
            Email
            <input
              type="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </label>

          <label>
            Password
            <input
              id="passwordInput"
              type="password"
              name="password"
              placeholder="Minimum 6 characters"
              minlength="6"
              required
            />
          </label>
          
          <label class="show-password-control">
            <input id="showPassword" type="checkbox" />
            <span>Show password</span>
          </label>

          <button id="authSubmit" class="primary-btn" type="submit">
            Sign in
          </button>

          <p id="authHelper" class="auth-helper">
            New to CareerMatch? Choose Create account above.
          </p>

          <p id="authMessage" class="auth-message"></p>
        </form>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
