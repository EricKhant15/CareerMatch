<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommended Internships</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-mark">CM</span>
        <span>Career<span class="brand-purple">Match</span></span>
      </div>

      <div class="user-card">
        <div class="avatar" id="studentAvatar">S</div>
        <div>
          <strong id="studentName">Student</strong>
          <span>Student</span>
        </div>
      </div>

      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="matches.html">Recommended</a>
        <a href="applications.html">Applications</a>
        <a href="saved.html">Saved</a>
        <a href="profile.html">Profile</a>
      </nav>

      <div class="sidebar-bottom">
        <a href="#">Settings</a>
        <a href="../index.html">Sign Out</a>
      </div>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1>Recommended Internships</h1>
          <p>Company internship posts matched to your profile.</p>
        </div>
        <a class="secondary-btn" href="profile.html">Edit Preferences</a>
      </header>

      <p id="recommendationsMessage" class="auth-message" aria-live="polite"></p>

      <section
        class="internship-grid"
        id="recommendationsGrid"
        aria-busy="true"
      >
        <article class="panel recommendation-state-card">
          <h2>Calculating recommendations...</h2>
          <p>We are comparing open internships with your student profile.</p>
        </article>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../guard.js"></script>
  <script src="../app.js"></script>
  <script src="matches.js"></script>
</body>
</html>
